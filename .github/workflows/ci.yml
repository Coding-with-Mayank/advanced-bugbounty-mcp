name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Docker Build + Tool Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t bugbounty-mcp:test .

      - name: Check Python package imports
        run: |
          docker run --rm bugbounty-mcp:test python -c "
          import mcp, pydantic, fastapi, httpx, aiohttp, motor, redis
          print('All Python imports OK')
          "

      - name: Check Go tools are installed
        run: |
          docker run --rm bugbounty-mcp:test bash -c "
          tools='subfinder httpx nuclei naabu katana dnsx waybackurls gau ffuf gobuster gowitness anew'
          ok=0; fail=0
          for t in \$tools; do
            if which \$t > /dev/null 2>&1; then
              echo \"✓ \$t\"
              ok=\$((ok+1))
            else
              echo \"✗ \$t (MISSING)\"
              fail=\$((fail+1))
            fi
          done
          echo ''
          echo \"\$ok tools OK, \$fail missing\"
          # Fail CI if more than 3 tools are missing
          [ \$fail -le 3 ] || exit 1
          "

      - name: Validate MCP server starts
        run: |
          # Send an MCP initialize message, expect a valid JSON response
          response=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            | timeout 10 docker run --rm -i bugbounty-mcp:test python -m mcp_server 2>/dev/null || true)
          echo "Response: $response"
          echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'result' in d, 'No result in response'; print('MCP server OK')"

  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check mcp_server/ hunt.py --ignore E501,E402
