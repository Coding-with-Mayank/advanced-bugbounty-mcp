version: '3.9'

# ═══════════════════════════════════════════════════════════════════════
#  Bug Bounty MCP Server — Docker Compose
#
#  Default (always on):
#    mcp-server, mongodb, redis
#
#  Optional automation layer (add --profile automation):
#    n8n — visual workflow automation for scheduled scans,
#           Slack/Telegram alerts, report pipelines
#
#  Start:  docker-compose up -d
#  + n8n:  docker-compose --profile automation up -d
# ═══════════════════════════════════════════════════════════════════════

services:

  # ── Core: Bug Bounty MCP Server ─────────────────────────────────────
  mcp-server:
    container_name: bugbounty-mcp
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./screenshots:/app/screenshots
      - ./wordlists:/app/wordlists
      - ./nuclei-templates:/app/nuclei-templates
      - ./logs:/app/logs
      - ./config/subfinder:/root/.config/subfinder
    ports:
      - "8080:8080"    # Optional REST API / status dashboard
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bugbounty-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G
    stdin_open: true
    tty: true
    command: python -m mcp_server

  # ── MongoDB: Findings Storage ────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: bugbounty-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme_please}
      MONGO_INITDB_DATABASE: bugbounty
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - bugbounty-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis: Cache + Rate Limiting ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bugbounty-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-changeme_please}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - bugbounty-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_please}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Optional: n8n Workflow Automation ────────────────────────────────
  #  Provides: scheduled scans, Slack/Telegram alerts, visual pipelines
  #  Access:   http://localhost:5678
  #  Enable:   docker-compose --profile automation up -d
  n8n:
    image: n8nio/n8n:latest
    container_name: bugbounty-n8n
    profiles:
      - automation
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme_please}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - DB_TYPE=sqlite
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows
    networks:
      - bugbounty-net
    depends_on:
      - mcp-server

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local

networks:
  bugbounty-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
